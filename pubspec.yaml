name: naqaa
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  bloc: ^8.1.2
  dartz: ^0.10.1
  easy_localization: ^3.0.2
  equatable: ^2.0.5
  firebase_auth: ^4.7.0
  firebase_core: ^2.15.0
  fl_toast: ^3.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_svg: ^2.0.7
  get_it: ^7.6.0
  go_router: ^9.0.2
  intro_slider: ^4.2.0
  restart_app: ^1.2.1
  shared_preferences: ^2.2.0
  validators: ^3.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.0
  flutter_native_splash: ^2.2.4
  flutter_test:
    sdk: flutter
# Todo: remove
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/splash.png
  android: true
  ios: true
  web: false
  color_dark: "#ffffff"
  image_dark: assets/images/splash.png
  android_12:
    color: "#ffffff"
    image: assets/images/splash-android12.png
# Todo: remove
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "assets/images/square-logo-background.png"
  adaptive_icon_foreground: "assets/images/square-logo.png"
  background_color: "#ffffff"
  web:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/localization/ar.json
    - assets/localization/en.json
    - assets/images/
    - assets/svgs/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/poppins/Poppins-Thin.ttf
          weight: 100
